    <meta name="description" content="Secure university examination hall ticket system for East Africa University.">
    <meta property="og:title" content="EduTicket Pro">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(2rem); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .animate-in { animation: fadeIn 0.5s ease-out forwards; }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        .slide-in-from-right-12 { animation: slideInRight 0.6s ease-out forwards; }
        .zoom-in { animation: zoomIn 0.4s ease-out forwards; }
        .animate-shake { animation: shake 0.3s ease-in-out infinite; }
        
        /* Usable, accessible scrollbar styles */
        .scrollbar-custom {
            scroll-behavior: smooth;
        }
        .scrollbar-custom::-webkit-scrollbar,
        .scrollbar-admin::-webkit-scrollbar,
        .no-scrollbar::-webkit-scrollbar {
            height: 10px;
            width: 10px;
        }
        .scrollbar-custom::-webkit-scrollbar-track,
        .scrollbar-admin::-webkit-scrollbar-track,
        .no-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb,
        .scrollbar-admin::-webkit-scrollbar-thumb,
        .no-scrollbar::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 8px;
            border: 2px solid #f1f5f9;
        }
        .scrollbar-custom::-webkit-scrollbar-thumb:hover,
        .scrollbar-admin::-webkit-scrollbar-thumb:hover,
        .no-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
        .no-scrollbar {
            -ms-overflow-style: auto;
            scrollbar-width: thin;
            scrollbar-color: #94a3b8 #f1f5f9;
        }
    </style>
